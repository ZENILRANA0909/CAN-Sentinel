[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "can-sentinel"
version = "1.0.0"
description = "Automotive CAN Bus Intrusion Detection & Monitoring Platform"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
    "python-can>=4.5",
    "websockets>=14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
can-sentinel = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
# Tests                                                                        #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: exercises several components together",
    "slow: takes more than a second of wall-clock time",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
]

# --------------------------------------------------------------------------- #
# Lint                                                                         #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",     # FastAPI's Depends()/Query() defaults are the documented idiom
    "RUF012",   # ORM/class attributes are not annotated ClassVar by convention here
    "ASYNC109", # receive(timeout=...) mirrors python-can's bus.recv(timeout=...);
                # a caller-side asyncio.timeout() would be a worse domain API
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
